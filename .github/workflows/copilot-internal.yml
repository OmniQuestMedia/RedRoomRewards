name: Copilot Internal Fast-Path (Ship-Gate)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  fast-gate:
    runs-on: ubuntu-latest
    if: startsWith(github.head_ref, 'copilot/') || startsWith(github.head_ref, 'grok/') || startsWith(github.head_ref, 'agent/')
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:ci
      - run: npm run ship-gate
