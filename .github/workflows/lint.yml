---
name: Lint (Super-Linter)

on: # yamllint disable-line rule:truthy
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: read
  statuses: write

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  super-linter:
    name: Super-Linter
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout (full history required)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Super-Linter (non-code scope)
        uses: super-linter/super-linter@v8.6.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: false
          YAML_VALIDATE_ALL_CODEBASE: false
          FILTER_REGEX_INCLUDE: ^(\.github/|docs/|PROGRAM_CONTROL/|[^/]+\.(md|yml|yaml|json)$)
          VALIDATE_MARKDOWN: true
          VALIDATE_JSON: true
          VALIDATE_YAML: true
          LINTER_RULES_PATH: .github/linters
          YAML_CONFIG_FILE: .yaml-lint.yml
          MARKDOWN_CONFIG_FILE: .markdownlint.yml
          STRIP_DEFAULT_WORKSPACE_FOR_REGEX: true
          LOG_LEVEL: VERBOSE
