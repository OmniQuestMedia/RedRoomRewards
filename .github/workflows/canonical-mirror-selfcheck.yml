# rule_applied_id: GOVERNANCE-EQ-v1
#
# Canonical Mirror Self-Check (fleet doc-kit, defense-in-depth).
#
# Verifies that any canonical artifact this repo mirrors still matches the
# SHA-256 pinned in .canonical-mirrors.json. Zero-coupling: no network, no
# cross-repo token, no dependency install. A clean no-op when the repo mirrors
# nothing. Advisory by default (never fails); set the repo variable
# CANONICAL_MIRROR_ENFORCE=1 to make drift block merges.
#
# The authoritative registry and the auto-correcting sync PRs live in
# OmniComplianceZone (services/drift-detection). This is the local tripwire.
#
# NOTE: scalars are intentionally unquoted so the file is byte-identical under
# every repo's Prettier config/version (single- vs double-quote defaults differ).

name: Canonical Mirror Self-Check

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: 0 7 * * *
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selfcheck:
    name: Verify canonical mirrors against pinned hashes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Run canonical mirror self-check
        env:
          CANONICAL_MIRROR_ENFORCE: ${{ vars.CANONICAL_MIRROR_ENFORCE }}
        run: node scripts/canonical-mirror-selfcheck.cjs
