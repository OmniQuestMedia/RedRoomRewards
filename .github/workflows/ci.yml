name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: File & Schema Checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Charter integrity check
        run: node scripts/ci/charter-integrity-check.js

      - name: No hardcoded balance values (B-008)
        run: |
          node scripts/ci/no-hardcoded-balance.js --self-test
          node scripts/ci/no-hardcoded-balance.js

      - name: tenant_id scope check (B-009)
        run: node scripts/ci/tenant-id-scope-check.js

      - name: Seed-fixture alignment check
        run: |
          node scripts/ci/seed-fixture-alignment-check.js --self-test
          node scripts/ci/seed-fixture-alignment-check.js

      - name: Log-secret-leak check
        run: |
          node scripts/ci/log-secret-leak-check.js --self-test
          node scripts/ci/log-secret-leak-check.js

      - name: OpenAPI freeze check
        run: |
          node scripts/ci/openapi-freeze-check.js --self-test
          node scripts/ci/openapi-freeze-check.js

      - name: Required file structure
        run: |
          required_files=(
            "docs/contracts/xxx-events.schema.json"
            "api/openapi.yaml"
          )
          for f in "${required_files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "MISSING: $f"
              exit 1
            fi
            echo "OK: $f"
          done

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Schema validation
        run: node scripts/validate-schema.js

      - name: Type check (tsc --noEmit)
        run: npm run type-check

      - name: Lint (ESLint)
        run: npm run lint

      - name: Prettier format check
        run: npm run format:check

      - name: Build (tsc)
        run: npm run build

      - name: Tests with coverage (test:ci)
        run: npm run test:ci

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore
