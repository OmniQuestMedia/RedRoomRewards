name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: File & Schema Checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Restricted path detection (fail-closed)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
          changed=$(git diff --name-only "refs/remotes/origin/${{ github.base_ref }}...HEAD" || true)
          restricted=$(printf "%s\n" "$changed" | grep -E '^(src/(ledger|wallets|consent)/|.*\bpii\b.*)' || true)
          if [ -n "$restricted" ]; then
            echo "Restricted paths changed:" && echo "$restricted"
          else
            echo "No restricted paths changed."
          fi

      - name: Lint CI Gate
        run: npm run lint:ci

      - name: Ship Gate
        env:
          SHIP_GATE_SKIP_LINT: '1'
        run: npm run ship-gate

      - name: Schema validation
        run: node scripts/validate-schema.js

      - name: Build (tsc)
        run: npm run build

      - name: Tests with coverage (test:ci)
        run: npm run test:ci

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.sha }}
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore
