version: 2
updates:
  # Keep npm / Node dependencies up to date
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'America/Toronto'
    open-pull-requests-limit: 10
    rebase-strategy: 'auto'
    labels:
      - 'dependencies'
      - 'security'
    groups:
      nestjs:
        dependency-type: 'production'
        patterns:
          - '@nestjs/*'
      eslint:
        dependency-type: 'development'
        patterns:
          - 'eslint*'
          - '@typescript-eslint/*'

  # Keep GitHub Actions up to date
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '04:30'
    open-pull-requests-limit: 10
    rebase-strategy: 'auto'
